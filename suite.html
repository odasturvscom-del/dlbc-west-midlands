<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C192B">
<meta name="robots" content="noindex,nofollow">
<title>Church Suite · Deeper Life West Midlands</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230C192B'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%232389F7' font-family='Arial' font-weight='bold'%3EDL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0C192B;--navy2:#101E32;--navy3:#16263D;--blue:#1976D2;--blue2:#2389F7;--line:rgba(255,255,255,.12);--muted:#93A3BA;--fg:#fff;--ok:#2FBF8F;--warn:#F0B24A;--err:#F0716C}
*{box-sizing:border-box;margin:0;padding:0}
html{padding-top:env(safe-area-inset-top,0px)}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--navy);color:var(--fg);font-size:15px;line-height:1.5}
a{color:var(--blue2);text-decoration:none}
h1,h2,h3,.disp{font-family:"Archivo","Arial Black",sans-serif;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:var(--navy3);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue2);outline-offset:1px;border-color:transparent}
textarea{min-height:88px;resize:vertical}
.top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--navy2);position:sticky;top:0;z-index:20}
.top .brand{font-family:"Archivo",sans-serif;font-weight:800;font-size:17px}
.top .brand small{display:block;font-weight:600;font-size:10px;letter-spacing:.14em;color:var(--muted)}
.top .who{margin-left:auto;text-align:right;font-size:13px;color:var(--muted)}
.top .who b{color:var(--fg)}
.layout{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 61px)}
nav{border-right:1px solid var(--line);padding:14px 10px;background:var(--navy2);position:sticky;top:61px;height:calc(100vh - 61px);overflow:auto}
nav .grp{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:16px 10px 6px}
nav .grp:first-child{margin-top:2px}
nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;color:#D8E2F0;font-weight:500;font-size:14px}
nav a:hover{background:var(--navy3)}
nav a.on{background:linear-gradient(90deg,rgba(35,137,247,.22),rgba(35,137,247,.06));color:#fff;box-shadow:inset 2px 0 0 var(--blue2)}
nav a .dot{width:7px;height:7px;border-radius:50%;background:var(--blue2);opacity:.55;flex:none}
main{padding:26px 30px;max-width:1120px}
main h1{font-size:26px;font-weight:800}
main .sub{color:var(--muted);margin:4px 0 20px;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
.card{background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:16px}
.card .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card .v{font-family:"Archivo",sans-serif;font-weight:800;font-size:26px;margin-top:6px}
.card .n{font-size:12px;color:var(--muted);margin-top:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.panel{background:var(--navy2);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
tr:hover td{background:rgba(35,137,247,.05)}
.btn{background:var(--navy3);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--blue2)}
.btn.pri{background:var(--blue);border-color:var(--blue)}
.btn.pri:hover{background:var(--blue2)}
.btn.danger{border-color:rgba(240,113,108,.5);color:var(--err)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:rgba(47,191,143,.4)}
.pill.warn{color:var(--warn);border-color:rgba(240,178,74,.4)}
.pill.err{color:var(--err);border-color:rgba(240,113,108,.4)}
.pill.info{color:var(--blue2);border-color:rgba(35,137,247,.5)}
form.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.fw{grid-column:1/-1}
.overlay{position:fixed;inset:0;background:rgba(4,10,20,.72);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow:auto}
.sheet{background:var(--navy2);border:1px solid var(--line);border-radius:16px;padding:22px;width:640px;max-width:100%}
.sheet h3{margin-bottom:14px}
.sheet .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.notice{border:1px solid var(--line);border-left:3px solid var(--blue2);background:var(--navy3);border-radius:10px;padding:10px 14px;font-size:13px;margin:10px 0}
.notice.err{border-left-color:var(--err)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--muted)}
.link{background:none;border:none;color:var(--blue2);padding:0;font-weight:600}
.badge{font-size:11px;color:var(--muted)}
@media(max-width:860px){
 .layout{grid-template-columns:1fr}
 nav{position:static;height:auto;display:flex;flex-wrap:wrap;gap:2px;border-right:0;border-bottom:1px solid var(--line)}
 nav .grp{width:100%;margin:8px 10px 2px}
 main{padding:18px 14px}
 form.f{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="top">
 <a href="/" style="display:flex;gap:12px;align-items:center">
  <svg width="34" height="34" viewBox="0 0 34 34"><rect width="34" height="34" rx="8" fill="#2389F7"/><path d="M17 7l8 7v13h-5.5v-7h-5v7H9V14z" fill="#0C192B"/></svg>
  <span class="brand">Deeper Life Bible Church<small>WEST MIDLANDS · CHURCH SUITE</small></span>
 </a>
 <div class="who" id="who"></div>
</div>
<div class="layout">
 <nav id="nav"></nav>
 <main id="main"><p class="sub">Loading…</p></main>
</div>
<div id="modal"></div>
<script src="/suite.js"></script>
</body>
</html>
